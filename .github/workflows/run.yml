name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '10 16 * * *' # 建议将 cron 表达式用引号包裹

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          # 多账号：在仓库 Secrets 里按需新增 GLADOS2 / GLADOS3 / …… 即可，
          # 未配置时值为空字符串，脚本会自动跳过，不影响原有账号。
          GLADOS2: ${{ secrets.GLADOS2 }}
          GLADOS_UA2: ${{ secrets.GLADOS_UA2 }}
          GLADOS2_UA: ${{ secrets.GLADOS2_UA }}
          GLADOS3: ${{ secrets.GLADOS3 }}
          GLADOS_UA3: ${{ secrets.GLADOS_UA3 }}
          GLADOS3_UA: ${{ secrets.GLADOS3_UA }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}

  # ---- 下面是新增的保活任务 ----
  keepalive-job:
    name: Keepalive Workflow
    # 仅在定时触发时才运行保活，手动或 push 触发时跳过
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write # 必须赋予写入权限才能调用 API 激活仓库
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
